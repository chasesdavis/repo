name: Build Axon Reborn (experimental)
on:
  push:
    branches: [main]
    paths:
      - 'tweaks/AxonReborn/**'
      - '.github/workflows/build-axon-reborn.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.variant }} (device validation required)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tweaks/AxonReborn
    strategy:
      fail-fast: false
      matrix:
        variant: [roothide, rootless, rootful]
    env:
      THEOS: ${{ github.workspace }}/.axon-theos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Set up pinned RootHide Theos and its vendor dependencies
        run: |
          git clone --no-checkout https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout cfba89a53a05b4a1b822121158acc3669c20602f
          git -C "$THEOS" submodule update --init --recursive
          xcrun --sdk iphoneos --show-sdk-path
      - name: Install pinned SDK with private framework stubs
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$RUNNER_TEMP/axon-sdks"
          git -C "$RUNNER_TEMP/axon-sdks" sparse-checkout set iPhoneOS16.5.sdk
          git -C "$RUNNER_TEMP/axon-sdks" checkout 0222fd5413cf4b9af096f37b4621afa2688572f7
          cp -R "$RUNNER_TEMP/axon-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          echo "SYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"
          echo "ISYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"
      - name: Test portable state and package configuration
        run: bash scripts/test.sh
      - name: Compile and package
        run: bash scripts/build.sh "${{ matrix.variant }}"
      - name: Test selector mounting with public UIKit in Simulator
        if: matrix.variant == 'roothide'
        timeout-minutes: 8
        run: bash scripts/test-ui.sh
      - name: Inspect package metadata
        run: |
          for package in packages/*.deb; do
            python3 scripts/verify-package.py "$package" "${{ matrix.variant }}"
            dpkg-deb -I "$package"
            dpkg-deb -c "$package"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axon-alpha-${{ matrix.variant }}
          path: tweaks/AxonReborn/packages/*.deb
          if-no-files-found: error
          retention-days: 14

  stage-candidate:
    name: Verify and stage RootHide candidate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: axon-alpha-roothide
          path: candidate
      - name: Prepare verified package and repository indexes
        run: python3 tweaks/AxonReborn/scripts/prepare-release.py candidate staged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axon-verified-release
          path: staged/
          if-no-files-found: error
          retention-days: 30
