# Reliable GitHub Pages deploy for the static Sileo/APT repo.
# Avoids flaky "legacy" branch builds that were leaving the site on stale Packages.
name: Deploy Sileo repo to Pages

on:
  push:
    branches: [main]
    paths:
      - "repo/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site root
        run: |
          mkdir -p _site
          rsync -a repo/ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
