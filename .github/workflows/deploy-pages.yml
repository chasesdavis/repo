name: Deploy repo to Pages

on:
  push:
    branches: [main]
    paths:
      - "repo/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify package index
        run: |
          set -euo pipefail
          test -f repo/Packages
          grep -q '^Package: com.chasedavis.lumen$' repo/Packages
          test "$(grep -c '^Package:' repo/Packages)" = "3"
          for deb in repo/debs/*.deb; do
            test -f "$deb"
          done
          echo "Index and package present"

      - name: Prepare site root
        run: |
          mkdir -p _site
          rsync -a repo/ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published index
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}Packages"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$url" | grep -q '^Package: com.chasedavis.lumen$'; then
              echo "Published index verified"
              exit 0
            fi
            sleep 5
          done
          echo "Published index missing Lumen" >&2
          exit 1
