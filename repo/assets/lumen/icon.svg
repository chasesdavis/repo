<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12202b"/>
      <stop offset="1" stop-color="#0a1319"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cc7fa"/>
      <stop offset="1" stop-color="#3f8ff5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <rect x="26" y="72" width="128" height="36" rx="18" fill="url(#pill)" filter="url(#glow)" opacity="0.92"/>
  <circle cx="48" cy="90" r="5" fill="#0a1319" opacity="0.85"/>
  <rect x="62" y="86" width="30" height="8" rx="4" fill="#0a1319" opacity="0.85"/>
  <rect x="98" y="86" width="18" height="8" rx="4" fill="#0a1319" opacity="0.55"/>
  <rect x="122" y="86" width="16" height="8" rx="4" fill="#0a1319" opacity="0.3"/>
</svg>
